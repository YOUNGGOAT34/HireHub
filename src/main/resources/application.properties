spring.config.import=env.properties
spring.application.name=HireHub
server.port=8080
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.schemas=public
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=false
spring.flyway.clean-on-startup=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.format_sql=true

# Release DB connections immediately after the query finishes instead of holding them during JSON serialization
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=25

# Enable Java 21+ Virtual Threads so Tomcat threads don't block while waiting on PostgreSQL I/O
spring.threads.virtual.enabled=true

#Caching
spring.cache.type=caffeine
spring.cache.cache-names=jobs,companies,companySearch,company,companyMembers
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30s


security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000

#spring.jpa.properties.hibernate.generate_statistics=true
#logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=true
logging.level.org.springframework.cache=TRACE
#logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO

#uncomment this for production
#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false